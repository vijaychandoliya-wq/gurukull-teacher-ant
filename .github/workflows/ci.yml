name: Teacher app CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: teacher-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --ci
      - run: npx tsc --noEmit

